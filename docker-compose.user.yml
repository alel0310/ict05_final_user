version: "3.8"

services:
  user-app:
    build: .
    container_name: ict05-user-app
    environment:
      SPRING_PROFILES_ACTIVE: "purchase"
    expose:
      - "8082"

  user-nginx:
    image: nginx:1.27
    container_name: ict05-user-nginx
    ports:
      - "8086:80"   # 브라우저에서 EC2_IP:8086 으로 접속
    volumes:
      # 방금 만든 nginx 설정
      - ./nginx.user.conf:/etc/nginx/nginx.conf:ro
      # 리액트 빌드 결과를 /usr/share/nginx/html/user 에 마운트
      - ./front-end/build:/usr/share/nginx/html/user:ro
    depends_on:
      - user-app
