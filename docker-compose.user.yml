version: "3.8"

services:
  user-app:
    build: .
    container_name: ict05-user-app
    expose:
      - "8082"

  nginx:
    image: nginx:1.27
    container_name: ict05-user-nginx
    ports:
      - "8086:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-app
