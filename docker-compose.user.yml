version: "3.8"

services:
  user-app:
    build: .
    container_name: ict05-user-app
    environment:
      - SPRING_PROFILES_ACTIVE=prod,receive
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/ict05final
      - SPRING_DATASOURCE_USERNAME=ictuser
      - SPRING_DATASOURCE_PASSWORD=ictpass123
    expose:
      - "8082"
    networks:
      - toastlab-net

  user-nginx:
    image: nginx:1.27
    container_name: ict05-user-nginx
    ports:
      - "8086:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./front-end/build:/usr/share/nginx/html/user:ro
    depends_on:
      - user-app
    networks:
      - toastlab-net

networks:
  toastlab-net:
    external: true    # admin-compose 가 만든 네트워크에 붙겠다는 의미
